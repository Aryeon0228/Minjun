<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>거북이 술래잡기</title>
<style>
  :root{
    --sky1:#8fd8ff; --sky2:#dff3ff;
    --ground1:#7ec850; --ground2:#57a03a;
    --hill1:#8ed36a; --hill2:#6dbb52;
    --pond1:#7fc9ef; --pond2:#4aa3d4;
    --ui-bg:#fff7e6; --ui-line:#e6c98f; --ui-text:#5b4326;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{
    font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
    background:#2f6f4e;
    overflow:hidden; user-select:none; touch-action:manipulation;
    display:flex; align-items:center; justify-content:center;
  }
  #app{width:100%;height:100%;display:flex;flex-direction:column;}

  /* ---------- HUD ---------- */
  #hud{
    flex:0 0 auto; display:flex; align-items:center; gap:10px;
    padding:8px 14px; background:var(--ui-bg);
    border-bottom:5px solid var(--ui-line); color:var(--ui-text);
  }
  .pill{
    display:flex;align-items:center;gap:6px;
    background:#fff;border:4px solid var(--ui-line);border-radius:999px;
    padding:4px 14px; font-weight:900; font-size:26px; line-height:1;
  }
  .pill .emoji{font-size:24px;}
  #slots{
    flex:1 1 auto; display:flex; flex-wrap:wrap; gap:6px;
    align-items:center; justify-content:center; min-height:46px;
  }
  .slot{
    width:46px;height:38px;border-radius:12px;
    background:#fdf0d5; border:3px dashed var(--ui-line);
    display:flex;align-items:center;justify-content:center;
  }
  .slot.filled{background:#fff;border-style:solid;animation:pop .45s ease-out;}
  .slot svg{width:100%;height:100%;}
  @keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
  .btn-ico{
    width:52px;height:52px;border-radius:16px;font-size:26px;
    background:#fff;border:4px solid var(--ui-line);cursor:pointer;
    display:flex;align-items:center;justify-content:center;padding:0;
  }
  .btn-ico:active{transform:scale(.92);}

  /* ---------- Stage ---------- */
  #stage{flex:1 1 auto;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#2f6f4e;}
  #scene{width:100%;height:100%;display:block;cursor:pointer;overflow:visible;}

  #skyTop{stop-color:var(--sky1);} #skyBot{stop-color:var(--sky2);}
  #gndTop{stop-color:var(--ground1);} #gndBot{stop-color:var(--ground2);}
  #pondTop{stop-color:var(--pond1);} #pondBot{stop-color:var(--pond2);}
  .hill-a{fill:var(--hill1);} .hill-b{fill:var(--hill2);}
  #moon,#stars{display:none;}
  .night #sun{display:none;} .night #moon,.night #stars{display:block;}
  .night #coverLayer,.night #bgDeco{filter:brightness(.72) saturate(.85);}
  .snow .roof-snow{display:block;}
  .roof-snow{display:none;}
  #stars circle{animation:twinkle 2.4s ease-in-out infinite;}
  @keyframes twinkle{0%,100%{opacity:.35}50%{opacity:1}}

  #coverLayer,#bgDeco,#bg{pointer-events:none;}
  #fx{pointer-events:none;}

  .anim,.rise{transform-origin:0 0;}
  .hint .anim{animation:wiggle 1.1s ease-in-out infinite;}
  @keyframes wiggle{0%,100%{transform:rotate(0deg)}25%{transform:rotate(7deg)}75%{transform:rotate(-7deg)}}
  .halo{animation:halo 1.2s ease-out infinite;}
  @keyframes halo{0%{r:20;opacity:.9}100%{r:70;opacity:0}}

  /* ---------- Overlay ---------- */
  #overlay{
    position:absolute;inset:0;display:none;
    align-items:center;justify-content:center;
    background:rgba(20,40,30,.55);backdrop-filter:blur(3px);
    z-index:5;
  }
  #overlay.show{display:flex;}
  .card{
    background:var(--ui-bg);border:8px solid var(--ui-line);border-radius:36px;
    padding:26px 34px;text-align:center;color:var(--ui-text);
    max-width:min(92vw,720px);box-shadow:0 16px 0 rgba(0,0,0,.18);
    animation:cardIn .4s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes cardIn{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  .card h1{margin:0 0 6px;font-size:clamp(28px,6vw,50px);letter-spacing:-1px;}
  .card p{margin:0 0 14px;font-size:clamp(15px,3vw,20px);font-weight:700;opacity:.75;}
  .card-turtles{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0 16px;}
  .card-turtles svg{width:74px;height:56px;}
  .big-btn{
    border:none;border-radius:999px;cursor:pointer;
    background:#ff9f43;color:#fff;font-weight:900;
    font-size:clamp(30px,7vw,46px);padding:14px 54px;
    box-shadow:0 9px 0 #d97c22; display:inline-flex;align-items:center;gap:12px;
  }
  .big-btn:active{transform:translateY(6px);box-shadow:0 3px 0 #d97c22;}
  .score-big{font-size:clamp(44px,11vw,86px);font-weight:900;line-height:1;margin:2px 0 10px;}

  /* ---------- Name bubble ---------- */
  #bubble{
    position:absolute;z-index:4;pointer-events:none;
    background:#fff;border:5px solid var(--ui-line);border-radius:999px;
    padding:6px 20px;font-weight:900;font-size:clamp(20px,4.4vw,32px);
    color:var(--ui-text);opacity:0;transform:translate(-50%,-50%) scale(.5);
    white-space:nowrap;
  }
  #bubble.show{animation:bubbleIn 1.1s ease-out forwards;}
  @keyframes bubbleIn{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}
    25%{opacity:1;transform:translate(-50%,-70%) scale(1.1)}
    60%{opacity:1;transform:translate(-50%,-90%) scale(1)}
    100%{opacity:0;transform:translate(-50%,-140%) scale(.95)}
  }

  /* 세로로 든 휴대폰에서는 마을이 너무 작아져서 가로로 돌려달라고 안내 */
  #rotate{
    position:fixed;inset:0;z-index:20;display:none;
    align-items:center;justify-content:center;
    background:#2f6f4e;color:#fff7e6;text-align:center;padding:24px;
  }
  #rotate .ico{font-size:88px;display:block;animation:turn 2s ease-in-out infinite;}
  #rotate .txt{font-size:26px;font-weight:900;margin-top:14px;line-height:1.5;}
  @keyframes turn{0%,40%{transform:rotate(0deg)}70%,100%{transform:rotate(90deg)}}
  @media (orientation:portrait) and (max-width:820px){
    #rotate{display:flex;}
  }

  @media (max-width:600px), (max-height:520px){
    #hud{padding:5px 8px;gap:6px;border-bottom-width:3px;}
    .pill{font-size:20px;padding:3px 10px;border-width:3px;}
    .btn-ico{width:42px;height:42px;font-size:20px;border-width:3px;}
    .slot{width:34px;height:28px;border-width:2px;}
    #slots{min-height:30px;gap:4px;flex-wrap:nowrap;}
  }
</style>
</head>
<body>
<div id="rotate">
  <div>
    <span class="ico">📱</span>
    <div class="txt">🐢 화면을 옆으로<br>돌려 주세요!</div>
  </div>
</div>

<div id="app">

    <div id="slots"></div>
    <div class="pill"><span class="emoji">🐢</span><span id="score">0</span></div>
    <button class="btn-ico" id="btnSound" aria-label="소리">🔊</button>

  <div id="stage">
    <svg id="scene" viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid meet">

      <!-- ===== background (turtles are drawn IN FRONT of this) ===== -->

        <g id="sun">

          <circle cx="760" cy="52" r="3.4"/><circle cx="620" cy="200" r="2.4"/>

        <!-- far hills -->

          </g>
          <!-- grass tufts + flowers -->

            <path d="M760 610 l0 -14 M768 610 l5 -11 M752 610 l-5 -11"/>
          </g>
          <g>
            <g transform="translate(200,610)"><circle r="6" fill="#ff8fb1"/><circle cx="-9" r="6" fill="#ff8fb1"/><circle cx="9" r="6" fill="#ff8fb1"/><circle cy="-9" r="6" fill="#ff8fb1"/><circle cy="9" r="6" fill="#ff8fb1"/><circle r="4.5" fill="#ffd43b"/></g>
            <g transform="translate(555,585)"><circle r="6" fill="#fff"/><circle cx="-9" r="6" fill="#fff"/><circle cx="9" r="6" fill="#fff"/><circle cy="-9" r="6" fill="#fff"/><circle cy="9" r="6" fill="#fff"/><circle r="4.5" fill="#ffd43b"/></g>
            <g transform="translate(830,600)"><circle r="6" fill="#c08fe8"/><circle cx="-9" r="6" fill="#c08fe8"/><circle cx="9" r="6" fill="#c08fe8"/><circle cy="-9" r="6" fill="#c08fe8"/><circle cy="9" r="6" fill="#c08fe8"/><circle r="4.5" fill="#ffd43b"/></g>
          </g>
        </g>
      </g>

      <!-- ===== turtles hide here (between bg and cover) ===== -->
      <g id="turtleLayer"></g>

      <!-- ===== things that hide the turtles ===== -->
      <g id="coverLayer">

        <!-- hiding cloud -->
        <g fill="#ffffff">
          <circle cx="270" cy="116" r="30"/><circle cx="306" cy="100" r="39"/>
          <circle cx="345" cy="116" r="28"/><rect x="256" y="112" width="104" height="32" rx="16"/>
        </g>

        <!-- house A -->
        <g>
          <rect x="60" y="300" width="170" height="112" fill="#f7e6c8" stroke="#c8a97e" stroke-width="4"/>
          <path d="M40 306 L145 232 L250 306 Z" fill="#e2725b" stroke="#b3543f" stroke-width="4" stroke-linejoin="round"/>
          <path class="roof-snow" d="M40 306 L145 232 L250 306 Z" fill="#fff" opacity=".85"/>
          <rect x="96" y="344" width="46" height="68" rx="4" fill="#a9714b" stroke="#8a5a2c" stroke-width="3"/>
          <circle cx="134" cy="380" r="4.5" fill="#ffe27a"/>
          <rect x="166" y="332" width="48" height="44" fill="#bfe4f5" stroke="#c8a97e" stroke-width="4"/>
          <path d="M190 332 v44 M166 354 h48" stroke="#c8a97e" stroke-width="4"/>
        </g>

        <!-- house B -->
        <g>
          <rect x="300" y="320" width="130" height="92" fill="#e9f0d6" stroke="#b9c49b" stroke-width="4"/>
          <path d="M286 326 L365 268 L444 326 Z" fill="#5aa9c9" stroke="#3f8299" stroke-width="4" stroke-linejoin="round"/>
          <path class="roof-snow" d="M286 326 L365 268 L444 326 Z" fill="#fff" opacity=".85"/>
          <rect x="318" y="356" width="38" height="56" rx="4" fill="#a9714b" stroke="#8a5a2c" stroke-width="3"/>
          <rect x="374" y="350" width="40" height="36" fill="#bfe4f5" stroke="#b9c49b" stroke-width="4"/>
          <path d="M394 350 v36 M374 368 h40" stroke="#b9c49b" stroke-width="4"/>
        </g>

        <!-- house C -->
        <g>
          <rect x="856" y="252" width="26" height="52" fill="#b3543f"/>
          <rect x="740" y="300" width="160" height="112" fill="#fdeee0" stroke="#d9b48f" stroke-width="4"/>
          <path d="M725 306 L820 238 L915 306 Z" fill="#8bc34a" stroke="#6a9b34" stroke-width="4" stroke-linejoin="round"/>
          <path class="roof-snow" d="M725 306 L820 238 L915 306 Z" fill="#fff" opacity=".85"/>
          <rect x="800" y="342" width="46" height="70" rx="4" fill="#a9714b" stroke="#8a5a2c" stroke-width="3"/>
          <circle cx="838" cy="378" r="4.5" fill="#ffe27a"/>
          <rect x="758" y="332" width="40" height="38" fill="#bfe4f5" stroke="#d9b48f" stroke-width="4"/>
          <path d="M778 332 v38 M758 351 h40" stroke="#d9b48f" stroke-width="4"/>
        </g>

        <!-- big tree -->
        <g>
          <path d="M546 416 q6 -62 0 -118 h30 q-6 56 0 118 z" fill="#8b5e3c"/>
          <circle cx="560" cy="270" r="58" fill="#4faa46"/>
          <circle cx="514" cy="298" r="42" fill="#5cb851"/>
          <circle cx="606" cy="296" r="44" fill="#5cb851"/>
          <circle cx="560" cy="318" r="46" fill="#43993d"/>
          <circle cx="538" cy="258" r="9" fill="#ff6b6b"/>
          <circle cx="586" cy="282" r="9" fill="#ff6b6b"/>
        </g>

        <!-- rock -->
        <g>
          <ellipse cx="620" cy="445" rx="42" ry="30" fill="#a8adb5"/>
          <ellipse cx="608" cy="436" rx="18" ry="11" fill="#c3c8ce"/>
        </g>

        <!-- bush 1 -->
        <g>
          <ellipse cx="270" cy="455" rx="52" ry="30" fill="#4faa46"/>
          <ellipse cx="248" cy="446" rx="26" ry="18" fill="#5cb851"/>
          <ellipse cx="292" cy="450" rx="20" ry="14" fill="#5cb851"/>
        </g>

        <!-- bush 3 -->
        <g>
          <ellipse cx="690" cy="470" rx="55" ry="32" fill="#4faa46"/>
          <ellipse cx="668" cy="460" rx="26" ry="18" fill="#5cb851"/>
          <ellipse cx="712" cy="466" rx="21" ry="14" fill="#5cb851"/>
        </g>

        <!-- haystack -->
        <g>
          <ellipse cx="900" cy="470" rx="55" ry="45" fill="#e8c86a"/>
          <path d="M858 452 q42 -14 84 0 M856 476 q44 -14 88 0 M862 498 q38 -12 76 0"
                stroke="#c9a63f" stroke-width="4" fill="none" stroke-linecap="round"/>
        </g>

        <!-- bush 2 -->

          <ellipse cx="456" cy="470" rx="27" ry="19" fill="#5cb851"/>
          <ellipse cx="504" cy="476" rx="22" ry="15" fill="#5cb851"/>

        <!-- barrel -->

          <rect x="325" y="482" width="50" height="7" fill="#8a5a2c"/>
          <rect x="325" y="504" width="50" height="7" fill="#8a5a2c"/>
        </g>

        <!-- well -->
        <g>
          <rect x="726" y="424" width="9" height="86" fill="#8b5e3c"/>
          <rect x="785" y="424" width="9" height="86" fill="#8b5e3c"/>
          <rect x="720" y="500" width="80" height="72" rx="10" fill="#9aa3ad" stroke="#7d8792" stroke-width="4"/>

          <path d="M702 436 L760 400 L818 436 Z" fill="#e2725b" stroke="#b3543f" stroke-width="4" stroke-linejoin="round"/>

          <rect x="476" y="516" width="15" height="58" rx="5" fill="#d9b98a" stroke="#b3946a" stroke-width="3"/>
          <rect x="504" y="516" width="15" height="58" rx="5" fill="#d9b98a" stroke="#b3946a" stroke-width="3"/>

          <ellipse cx="130" cy="550" rx="100" ry="45" fill="url(#pondGrad)" stroke="#8fd3f0" stroke-width="5"/>

        <!-- bush 4 -->

      <!-- ===== 탭을 받아주는 투명한 면 (판정은 자바스크립트가 한다) ===== -->
      <rect id="tapSurface" x="-700" y="-700" width="2400" height="2100" fill="none" pointer-events="all"/>
    </svg>

    <div id="bubble"></div>

    <div id="overlay" class="show">
      <div class="card" id="card"></div>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

/* =========================================================
   거북이 종류
   ========================================================= */
const TURTLES = [
  {id:'round',  name:'동글이',  shell:'#5fb85f', dark:'#3c8f3f', light:'#9be09b', skin:'#a8d84f', pattern:'plates'},
  {id:'star',   name:'별이',    shell:'#ffd23d', dark:'#e0a100', light:'#fff0b0', skin:'#f7b731', pattern:'star'},
  {id:'heart',  name:'하트',    shell:'#ff8fb1', dark:'#e6567f', light:'#ffd0de', skin:'#ffb3c8', pattern:'heart'},
  {id:'flower', name:'꽃송이',  shell:'#c08fe8', dark:'#9b5fd0', light:'#e6d2f7', skin:'#b48ee0', pattern:'flower'},
  {id:'dot',    name:'점박이',  shell:'#5fa8e8', dark:'#2f7cc0', light:'#c2e2ff', skin:'#7fc4f0', pattern:'dots'},
  {id:'stripe', name:'줄무늬',  shell:'#ff9a4d', dark:'#d96b1f', light:'#ffd9b8', skin:'#ffb877', pattern:'stripes'},
  {id:'rain',   name:'무지개',  shell:'#fdfdfd', dark:'#cfcfcf', light:'#ffffff', skin:'#9ad4c8', pattern:'rainbow'},
  {id:'spark',  name:'반짝이',  shell:'#5fded0', dark:'#28b3a3', light:'#c6f5ee', skin:'#7fe6d8', pattern:'sparkle'}
];

/* =========================================================
   숨는 자리 (거북이 중심 좌표 / 크기 / 좌우 반전)
   ========================================================= */
const SPOTS = [
  {id:'houseA', x:218, y:392, s:0.50, flip:false},
  {id:'houseB', x:310, y:395, s:0.50, flip:true },
  {id:'houseC', x:890, y:392, s:0.50, flip:false},
  {id:'tree',   x:640, y:300, s:0.45, flip:false},
  {id:'cloud',  x:365, y:108, s:0.45, flip:false},
  {id:'bush1',  x:280, y:422, s:0.50, flip:false},
  {id:'bush2',  x:490, y:444, s:0.50, flip:true },
  {id:'bush3',  x:698, y:435, s:0.50, flip:false},
  {id:'bush4',  x:890, y:516, s:0.50, flip:true },
  {id:'bush5',  x:630, y:557, s:0.50, flip:false},
  {id:'rock',   x:628, y:412, s:0.48, flip:false},
  {id:'hay',    x:875, y:427, s:0.50, flip:true },
  {id:'barrel', x:360, y:500, s:0.45, flip:false},
  {id:'well',   x:760, y:490, s:0.50, flip:false},
  {id:'fence',  x:490, y:513, s:0.50, flip:true },
  {id:'pond',   x:140, y:505, s:0.55, flip:false}
];

/* =========================================================
   마을 분위기 (레벨마다 순환)
   ========================================================= */
const MOODS = [
  {name:'낮',   cls:'',      vars:{'--sky1':'#8fd8ff','--sky2':'#dff3ff','--ground1':'#7ec850','--ground2':'#57a03a','--hill1':'#8ed36a','--hill2':'#6dbb52','--pond1':'#7fc9ef','--pond2':'#4aa3d4'}},
  {name:'노을', cls:'',      vars:{'--sky1':'#ff9a6b','--sky2':'#ffe1b0','--ground1':'#7bb44c','--ground2':'#4e8a37','--hill1':'#89c063','--hill2':'#63a04b','--pond1':'#ffbf8f','--pond2':'#e8845a'}},
  {name:'밤',   cls:'night', vars:{'--sky1':'#16224f','--sky2':'#3c56a0','--ground1':'#3b7440','--ground2':'#204427','--hill1':'#3f7548','--hill2':'#2d5a37','--pond1':'#5f88c4','--pond2':'#2f5290'}},
  {name:'눈',   cls:'snow',  vars:{'--sky1':'#cfe6f5','--sky2':'#f4fbff','--ground1':'#f2fafd','--ground2':'#cfe4ef','--hill1':'#e6f3fa','--hill2':'#cfe4ef','--pond1':'#d8f0fb','--pond2':'#a9d8ee'}}
];

/* =========================================================
   거북이 그리기
   ========================================================= */
let uid = 0;

function hex(cx, cy, r, fill){
  let p = [];
  for(let i=0;i<6;i++){
    const a = Math.PI/180*(60*i - 30);
    p.push((cx + r*Math.cos(a)).toFixed(1) + ',' + (cy + r*Math.sin(a)).toFixed(1));
  }
  return '<polygon points="'+p.join(' ')+'" fill="'+fill+'"/>';
}

const STAR_PTS = '0,-20 4.7,-6.5 19,-6.2 7.6,2.5 11.8,16.2 0,8 -11.8,16.2 -7.6,2.5 -19,-6.2 -4.7,-6.5';

function shellPattern(t, clipId){
  const d = t.dark, l = t.light;
  const clip = ' clip-path="url(#'+clipId+')"';
  switch(t.pattern){
    case 'plates':
      return '<g'+clip+' opacity=".8">'+
        hex(0,-8,13,d)+hex(-24,2,11,d)+hex(24,2,11,d)+
        hex(-13,-22,10,d)+hex(13,-22,10,d)+'</g>';
    case 'star':
      return '<g'+clip+'><polygon points="'+STAR_PTS+'" transform="translate(0,-5)" fill="'+d+'"/></g>';
    case 'heart':
      return '<g'+clip+'><path transform="translate(0,-6)" fill="'+d+'" '+
        'd="M0,10 C-15,-3 -19,-15 -10,-19 C-4,-22 0,-17 0,-13 C0,-17 4,-22 10,-19 C19,-15 15,-3 0,10 Z"/></g>';
    case 'flower':{
      let petals = '';
      for(let i=0;i<5;i++){
        petals += '<ellipse rx="7.5" ry="13" fill="'+l+'" transform="rotate('+(i*72)+') translate(0,-11)"/>';
      }
      return '<g'+clip+'><g transform="translate(0,-6)">'+petals+'<circle r="6" fill="#ffd23d"/></g></g>';
    }
    case 'dots':
      return '<g'+clip+' fill="'+l+'">'+
        '<circle cx="-20" cy="-4" r="7"/><circle cx="2" cy="-14" r="8"/>'+
        '<circle cx="22" cy="-2" r="7"/><circle cx="-6" cy="4" r="5"/>'+
        '<circle cx="14" cy="-20" r="4.5"/><circle cx="-28" cy="6" r="4.5"/></g>';
    case 'stripes':{
      let s = '';
      for(let x=-34;x<=30;x+=20) s += '<rect x="'+x+'" y="-34" width="10" height="52" rx="5" fill="'+d+'"/>';
      return '<g'+clip+' opacity=".85">'+s+'</g>';
    }
    case 'rainbow':{
      const cs = ['#ff6b6b','#ffa94d','#ffd43b','#51cf66','#4dabf7','#b197fc'];
      let s = '';
      cs.forEach(function(c,i){
        const rx = 38 - i*6, ry = 32 - i*5;
        s += '<path d="M'+(-rx)+' 10 A '+rx+' '+ry+' 0 0 1 '+rx+' 10" fill="none" stroke="'+c+'" stroke-width="6.5"/>';
      });
      return '<g'+clip+'>'+s+'</g>';
    }
    case 'sparkle':{
      const spark = 'M0,-10 Q1.6,-1.6 10,0 Q1.6,1.6 0,10 Q-1.6,1.6 -10,0 Q-1.6,-1.6 0,-10 Z';
      const at = [[-20,-4,1],[4,-14,1.25],[22,0,.9],[-6,2,.7],[16,-22,.6]];
      let s = '';
      at.forEach(function(p){
        s += '<path d="'+spark+'" fill="#ffffff" opacity=".9" transform="translate('+p[0]+','+p[1]+') scale('+p[2]+')"/>';
      });
      return '<g'+clip+'>'+s+'</g>';
    }
  }
  return '';
}

/* 어떤 배경 위에서도 눈에 띄도록 흰 테두리를 먼저 깔아준다 */
const SILHOUETTE =
  '<g fill="#ffffff" stroke="#ffffff" stroke-width="8" stroke-linejoin="round">'+
  '<ellipse cx="-24" cy="14" rx="12" ry="9" transform="rotate(-12 -24 14)"/>'+
  '<ellipse cx="24" cy="16" rx="13" ry="10" transform="rotate(10 24 16)"/>'+
  '<path d="M-36 2 q-15 3 -17 13 q12 -1 17 -7 z"/>'+
  '<ellipse cx="46" cy="-2" rx="16" ry="14"/>'+
  '<ellipse cx="0" cy="10" rx="40" ry="13"/>'+
  '<path d="M-38 10 A38 32 0 0 1 38 10 Z"/>'+
  '</g>';

/* 거북이 본체 (중심 0,0 / 오른쪽을 봄 / 대략 x -52..62, y -22..26) */
function turtleArt(t){
  const cid = 'dome' + (++uid);
  return ''+
  '<defs><clipPath id="'+cid+'"><path d="M-38 10 A38 32 0 0 1 38 10 Z"/></clipPath></defs>'+
  SILHOUETTE+
  // 다리 / 꼬리
  '<ellipse cx="-24" cy="14" rx="12" ry="9" fill="'+t.skin+'" transform="rotate(-12 -24 14)"/>'+
  '<ellipse cx="24" cy="16" rx="13" ry="10" fill="'+t.skin+'" transform="rotate(10 24 16)"/>'+
  '<path d="M-36 2 q-15 3 -17 13 q12 -1 17 -7 z" fill="'+t.skin+'"/>'+
  // 머리
  '<ellipse cx="46" cy="-2" rx="16" ry="14" fill="'+t.skin+'"/>'+
  '<circle cx="52" cy="-7" r="3.8" fill="#3b2f2a"/>'+
  '<circle cx="53.3" cy="-8.4" r="1.4" fill="#ffffff"/>'+
  '<circle cx="45" cy="4" r="4.2" fill="#ff8fb1" opacity=".55"/>'+
  '<path d="M51 4 q5 3.5 9 0" stroke="#3b2f2a" stroke-width="2" fill="none" stroke-linecap="round"/>'+
  // 등껍질
  '<ellipse cx="0" cy="10" rx="40" ry="13" fill="'+t.dark+'"/>'+
  '<path d="M-38 10 A38 32 0 0 1 38 10 Z" fill="'+t.shell+'"/>'+
  shellPattern(t, cid)+
  '<path d="M-38 10 A38 32 0 0 1 38 10 Z" fill="none" stroke="'+t.dark+'" stroke-width="3.5"/>'+
  '<ellipse cx="-15" cy="-8" rx="10" ry="6" fill="#ffffff" opacity=".28" transform="rotate(-25 -15 -8)"/>';
}

function miniTurtleSVG(t){
  return '<svg viewBox="-62 -34 132 70" xmlns="http://www.w3.org/2000/svg">'+turtleArt(t)+'</svg>';
}

/* =========================================================
   소리
   ========================================================= */
let actx = null, soundOn = true;

function audio(){
  if(!actx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    actx = new AC();
  }
  if(actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(freq, delay, dur, type, vol){
  if(!soundOn) return;
  const ac = audio(); if(!ac) return;
  const t0 = ac.currentTime + delay;
  const osc = ac.createOscillator(), g = ac.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol || 0.2, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g); g.connect(ac.destination);
  osc.start(t0); osc.stop(t0 + dur + 0.05);
}
function sfxFind(n){
  const base = [523, 587, 659, 698, 784, 880, 988, 1046, 1175];
  const f = base[Math.min(n, base.length - 1)];
  tone(f, 0, 0.16, 'triangle', 0.22);
  tone(f * 1.5, 0.09, 0.2, 'sine', 0.16);
  tone(f * 2, 0.18, 0.26, 'sine', 0.1);
}
function sfxMiss(){ tone(190, 0, 0.1, 'sine', 0.1); }
function sfxClear(){
  [523,659,784,1046].forEach(function(f,i){ tone(f, i*0.13, 0.3, 'triangle', 0.2); });
  tone(1318, 0.55, 0.55, 'sine', 0.18);
}
function sfxStart(){ tone(659,0,0.14,'triangle',0.18); tone(880,0.12,0.24,'sine',0.16); }

function say(text){
  if(!soundOn || !('speechSynthesis' in window)) return;
  try{
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR'; u.rate = 0.95; u.pitch = 1.5; u.volume = 0.9;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){ /* 음성 지원 안 하면 그냥 넘어감 */ }
}

/* =========================================================
   게임
   ========================================================= */
const svgNS = 'http://www.w3.org/2000/svg';
const scene       = document.getElementById('scene');
const turtleLayer = document.getElementById('turtleLayer');
const fxLayer     = document.getElementById('fx');
const slotsEl     = document.getElementById('slots');
const scoreEl     = document.getElementById('score');
const levelEl     = document.getElementById('levelNum');
const overlay     = document.getElementById('overlay');
const cardEl      = document.getElementById('card');
const bubbleEl    = document.getElementById('bubble');
const stageEl     = document.getElementById('stage');

let level = 1, score = 0, hidden = [], foundCount = 0, playing = false;
let lastFindAt = 0, hintTimer = null;

function shuffle(a){
  const b = a.slice();
  for(let i=b.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    const tmp = b[i]; b[i] = b[j]; b[j] = tmp;
  }
  return b;
}
function turtleCountFor(lv){ return Math.min(2 + lv, 9, SPOTS.length); }

function applyMood(lv){
  const m = MOODS[(lv - 1) % MOODS.length];
  scene.setAttribute('class', m.cls);
  const root = document.documentElement;
  for(const k in m.vars) root.style.setProperty(k, m.vars[k]);
}

function buildLevel(){
  turtleLayer.innerHTML = '';
  fxLayer.innerHTML = '';

  const n     = turtleCountFor(level);
  const spots = shuffle(SPOTS).slice(0, n);
  const types = shuffle(TURTLES);

  hidden = spots.map(function(spot, i){
    const type = types[i % types.length];

    // g(위치) > rise(떠오르기) > anim(꿈틀/팝) > art(크기·반전)
    // 위치는 transform '속성'으로만 두고, CSS transform 애니메이션은 안쪽 그룹에만 건다.
    const g = document.createElementNS(svgNS, 'g');
    g.setAttribute('transform', 'translate(' + spot.x + ',' + spot.y + ')');
    const rise = document.createElementNS(svgNS, 'g');
    rise.setAttribute('class', 'rise');
    const anim = document.createElementNS(svgNS, 'g');
    anim.setAttribute('class', 'anim');
    const art = document.createElementNS(svgNS, 'g');
    art.setAttribute('transform', 'scale(' + (spot.flip ? -spot.s : spot.s) + ',' + spot.s + ')');
    art.innerHTML = turtleArt(type);
    anim.appendChild(art); rise.appendChild(anim); g.appendChild(rise);
    turtleLayer.appendChild(g);

    // 손이 작아도 잘 눌리도록 넉넉하게. 겹치면 '가장 가까운 거북이'가 잡힌다.
    return {type:type, spot:spot, g:g, radius:Math.max(42, 96 * spot.s), found:false};
  });

  foundCount = 0;
  slotsEl.innerHTML = '';
  for(let i=0;i<n;i++){
    const s = document.createElement('div');
    s.className = 'slot';
    slotsEl.appendChild(s);
  }
  levelEl.textContent = level;
  scoreEl.textContent = score;
  applyMood(level);
  lastFindAt = Date.now();
}

function clearHints(){
  hidden.forEach(function(r){ r.g.classList.remove('hint'); });
  const halos = fxLayer.querySelectorAll('.halo');
  for(let i=0;i<halos.length;i++) halos[i].remove();
}

function tickHint(){
  if(!playing) return;
  const idle = Date.now() - lastFindAt;
  const left = hidden.filter(function(r){ return !r.found; });
  if(!left.length) return;

  if(idle > 9000) left.forEach(function(r){ r.g.classList.add('hint'); });
  if(idle > 18000 && !fxLayer.querySelector('.halo')){
    const r = left[Math.floor(Math.random() * left.length)];
    const c = document.createElementNS(svgNS, 'circle');
    c.setAttribute('class', 'halo');
    c.setAttribute('cx', r.spot.x); c.setAttribute('cy', r.spot.y);
    c.setAttribute('r', 20);
    c.setAttribute('fill', 'none');
    c.setAttribute('stroke', '#fff36b');
    c.setAttribute('stroke-width', '7');
    fxLayer.appendChild(c);
  }
}

function confetti(x, y){
  const cols = ['#ff6b6b','#ffd43b','#51cf66','#4dabf7','#b197fc','#ff9a4d'];
  // 원의 cx/cy 대신 그룹을 옮겨 둔다. 그래야 scale()이 제자리에서 일어난다.
  const box = document.createElementNS(svgNS, 'g');
  box.setAttribute('transform', 'translate(' + x + ',' + y + ')');
  fxLayer.appendChild(box);

  let longest = 0;
  for(let i=0;i<16;i++){
    const c = document.createElementNS(svgNS, 'circle');
    c.setAttribute('cx', 0); c.setAttribute('cy', 0);
    c.setAttribute('r', 4 + Math.random()*5);
    c.setAttribute('fill', cols[i % cols.length]);
    box.appendChild(c);
    const a = Math.random() * Math.PI * 2, d = 60 + Math.random() * 90;
    const ms = 700 + Math.random() * 400;
    longest = Math.max(longest, ms);
    c.animate([
      {transform:'translate(0px,0px) scale(1)', opacity:1},
      {transform:'translate(' + (Math.cos(a)*d).toFixed(1) + 'px,' + (Math.sin(a)*d - 30).toFixed(1) + 'px) scale(.2)', opacity:0}
    ], {duration: ms, easing:'cubic-bezier(.2,.7,.4,1)', fill:'forwards'});
  }
  setTimeout(function(){ box.remove(); }, longest + 60);
}

function showBubble(text, x, y){
  const box = scene.getBoundingClientRect();
  const stage = stageEl.getBoundingClientRect();
  const sx = box.width / 1000, sy = box.height / 620;
  const s = Math.min(sx, sy);
  const ox = box.left - stage.left + (box.width - 1000 * s) / 2;
  const oy = box.top - stage.top + (box.height - 620 * s) / 2;
  bubbleEl.textContent = text;
  bubbleEl.style.left = (ox + x * s) + 'px';
  bubbleEl.style.top  = (oy + y * s) + 'px';
  bubbleEl.classList.remove('show');
  void bubbleEl.offsetWidth;
  bubbleEl.classList.add('show');
}

/* 화면 좌표 -> 마을(SVG) 좌표 */
function toScene(ev){
  const ctm = scene.getScreenCTM();
  if(!ctm) return null;
  const pt = scene.createSVGPoint();
  pt.x = ev.clientX; pt.y = ev.clientY;
  return pt.matrixTransform(ctm.inverse());
}

function onTap(ev){
  if(!playing) return;
  const p = toScene(ev);
  if(!p) return;
  let best = null, bestDist = Infinity;
  hidden.forEach(function(r){
    if(r.found) return;
    const dx = p.x - r.spot.x, dy = p.y - r.spot.y;
    const d = Math.sqrt(dx*dx + dy*dy);
    if(d <= r.radius && d < bestDist){ bestDist = d; best = r; }
  });
  if(best) onFind(best); else onMiss();
}

function onFind(rec){
  if(!playing || rec.found) return;
  rec.found = true;
  clearHints();
  lastFindAt = Date.now();

  // 숨은 것 위로 꺼내서 크게 보여주기
  fxLayer.appendChild(rec.g);
  const anim = rec.g.querySelector('.anim');
  anim.animate([
    {transform:'scale(1) rotate(0deg)'},
    {transform:'scale(1.5) rotate(-14deg)'},
    {transform:'scale(1.35) rotate(14deg)'},
    {transform:'scale(1.4) rotate(0deg)'}
  ], {duration:520, easing:'ease-out', fill:'forwards'});

  rec.g.querySelector('.rise').animate(
    [{transform:'translate(0px,0px)'},
     {transform:'translate(0px,0px)', offset:.55},
     {transform:'translate(0px,-70px)'}],
    {duration:1100, easing:'ease-in', fill:'forwards'}
  );
  const away = rec.g.animate(
    [{opacity:1}, {opacity:1, offset:.6}, {opacity:0}],
    {duration:1100, easing:'ease-in', fill:'forwards'}
  );
  away.onfinish = function(){ rec.g.remove(); };

  confetti(rec.spot.x, rec.spot.y);
  sfxFind(foundCount);
  showBubble(rec.type.name + ' 찾았다!', rec.spot.x, rec.spot.y - 30);
  say(rec.type.name);

  score += 1;
  foundCount += 1;
  scoreEl.textContent = score;

  const slot = slotsEl.children[foundCount - 1];
  if(slot){ slot.className = 'slot filled'; slot.innerHTML = miniTurtleSVG(rec.type); }

  if(foundCount >= hidden.length){
    playing = false;
    setTimeout(levelClear, 1000);
  }
}

function onMiss(){
  if(!playing) return;
  sfxMiss();
}

function levelClear(){
  sfxClear();
  const found = hidden.map(function(r){ return r.type; });
  cardEl.innerHTML =
    '<h1>🎉 다 찾았다! 🎉</h1>' +
    '<div class="card-turtles">' + found.map(miniTurtleSVG).join('') + '</div>' +
    '<div class="score-big">🐢 ' + score + '</div>' +
    '<p>다음 마을로 가볼까요?</p>' +
    '<button class="big-btn" id="btnNext">▶</button>';
  overlay.classList.add('show');
  document.getElementById('btnNext').addEventListener('pointerdown', function(){
    level += 1;
    startLevel();
  });
  say('다 찾았어요');
}

function startLevel(){
  overlay.classList.remove('show');
  buildLevel();
  playing = true;
  sfxStart();
}

function titleScreen(){
  playing = false;
  cardEl.innerHTML =
    '<h1>🐢 거북이 술래잡기</h1>' +
    '<div class="card-turtles">' + TURTLES.slice(0,4).map(miniTurtleSVG).join('') + '</div>' +
    '<p>마을에 숨은 거북이를 찾아 주세요!</p>' +
    '<button class="big-btn" id="btnStart">▶</button>';
  overlay.classList.add('show');
  document.getElementById('btnStart').addEventListener('pointerdown', function(){
    audio();
    level = 1; score = 0;
    startLevel();
  });
}

/* ---- 버튼 ---- */
scene.addEventListener('pointerdown', onTap);

document.getElementById('btnSound').addEventListener('pointerdown', function(){
  soundOn = !soundOn;
  this.textContent = soundOn ? '🔊' : '🔈';
  if(!soundOn && 'speechSynthesis' in window){ try{ window.speechSynthesis.cancel(); }catch(e){} }
});

document.getElementById('btnRestart').addEventListener('pointerdown', function(){
  level = 1; score = 0;
  titleScreen();
});

hintTimer = setInterval(tickHint, 1000);
titleScreen();

})();
</script>
